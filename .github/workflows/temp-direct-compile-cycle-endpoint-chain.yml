name: temp-direct-compile-normalization-induction

on:
  push:
    branches:
      - ci/direct-compile-cycle-endpoint-chain-20260826

jobs:
  direct-compile:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3fecc7498f19a3701de821bc8b41e93f5f9b7e09
          fetch-depth: 1
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build direct dependencies
        run: lake build Poincare.Validity Poincare.TriangulationTopologicalS3Transport
      - name: Direct compile and capture diagnostic
        id: lean
        shell: bash
        run: |
          set +e
          lake env lean lean/Poincare/TriangulationTopologicalNormalizationInduction.lean > lean-error.log 2>&1
          status=$?
          cat lean-error.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Lean diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: lean-normalization-induction-diagnostic
          path: lean-error.log
      - name: Preserve compile failure
        if: steps.lean.outputs.status != '0'
        run: exit 1
