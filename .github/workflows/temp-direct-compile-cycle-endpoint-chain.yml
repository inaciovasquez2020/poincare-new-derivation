name: temp-direct-compile-manifold-link-connectivity

on:
  push:
    branches:
      - ci/direct-compile-cycle-endpoint-chain-20260826

jobs:
  direct-compile:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5bda73f2e782cfab999283e72551b7e59031264d
          fetch-depth: 1
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build direct dependency
        run: lake build Poincare.TriangulationTopologicalManifoldVertexLinkStarConnectedness
      - name: Direct compile and capture diagnostic
        id: lean
        shell: bash
        run: |
          set +e
          lake env lean lean/Poincare/TriangulationTopologicalManifoldVertexLinkCombinatorialConnectedness.lean > lean-error.log 2>&1
          status=$?
          cat lean-error.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Lean diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: lean-manifold-link-connectivity-diagnostic
          path: lean-error.log
      - name: Preserve compile failure
        if: steps.lean.outputs.status != '0'
        run: exit 1
