name: Positional stellar Phi cost focused Lean audit

on:
  push:
    paths:
      - 'lean/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/positional-stellar-phi-cost-audit.yml'
  pull_request:
    paths:
      - 'lean/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/positional-stellar-phi-cost-audit.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD := $EXPECTED_SHA"
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          auto-config: false
      - name: Compile exact Phi cost module
        run: lake build Poincare.PositionalStellarPhiCost
      - name: Audit exact theorem kernel axioms
        shell: bash
        run: |
          set -euo pipefail
          audit="$(mktemp --suffix=.lean)"
          report="$(mktemp)"
          trap 'rm -f "$audit" "$report"' EXIT
          printf '%s\n' \
            'import Poincare.PositionalStellarPhiCost' \
            '#print axioms Poincare.ClosedTriangulationCore.PhiSupport_add_four_mul_vertices_eq_four_mul_tets' \
            '#print axioms Poincare.Move41Site.insertFreshAt_vertexSupport_iff' \
            '#print axioms Poincare.Move41Site.insertFreshAt_vertexSupport_length' \
            '#print axioms Poincare.Move41Site.insertFreshAt_tets_length' \
            '#print axioms Poincare.Move41Site.insertFreshAt_PhiSupport_eq_add_eight' > "$audit"
          lake env lean "$audit" > "$report"
          python3 - "$report" <<'PY'
          import re
          import sys
          from pathlib import Path
          report = Path(sys.argv[1]).read_text(encoding="utf-8")
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = [
              "Poincare.ClosedTriangulationCore.PhiSupport_add_four_mul_vertices_eq_four_mul_tets",
              "Poincare.Move41Site.insertFreshAt_vertexSupport_iff",
              "Poincare.Move41Site.insertFreshAt_vertexSupport_length",
              "Poincare.Move41Site.insertFreshAt_tets_length",
              "Poincare.Move41Site.insertFreshAt_PhiSupport_eq_add_eight",
          ]
          markers = list(re.finditer(r"^'([^'\n]+)'[ \t]+", report, re.MULTILINE))
          assert len(markers) == len(names), f"wrong axiom-report count: {len(markers)}"
          assert [m.group(1) for m in markers] == names, "missing or reordered declarations"
          for i, marker in enumerate(markers):
              stop = markers[i + 1].start() if i + 1 < len(markers) else len(report)
              body = report[marker.end():stop].strip()
              if body == "does not depend on any axioms":
                  axioms = set()
              else:
                  match = re.fullmatch(r"depends on axioms:\s*\[([^\]]*)\]", body, re.DOTALL)
                  assert match is not None, f"unrecognized axiom report: {names[i]}: {body!r}"
                  axioms = {a.strip() for a in match.group(1).split(",") if a.strip()}
                  assert axioms, f"empty axiom report: {names[i]}"
              assert axioms <= allowed, f"forbidden axioms: {names[i]}: {axioms - allowed}"
              print(f"{names[i]}: AXIOM_AUDIT_PASS {sorted(axioms)}")
          PY
