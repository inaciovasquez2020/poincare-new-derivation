name: G2 actual boundary breakpoint anchors Lean audit
on:
  pull_request:
    paths:
      - 'research/candidates/G2ActualBoundaryBreakpointAnchors.lean'
      - '.github/workflows/g2-actual-boundary-breakpoint-anchors.yml'
  workflow_dispatch:
jobs:
  breakpoint-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile actual boundary breakpoint anchors and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean research/candidates/G2ActualBoundaryBreakpointAnchors.lean > /tmp/g2-anchors.log 2>&1 || {
            cat /tmp/g2-anchors.log
            exit 1
          }
          cat /tmp/g2-anchors.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log=Path('/tmp/g2-anchors.log').read_text()
          for name in [
            'Poincare.g2_actual_boundary_breakpoint_all_cell_labels',
            'Poincare.g2_actual_boundary_breakpoint_has_label_anchor',
          ]:
            pattern=re.escape(f"'{name}'")+r" (?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)"
            matches=list(re.finditer(pattern, log))
            assert len(matches)==1,(name,len(matches))
            raw=matches[0].group(1)
            axioms=set() if raw is None else {s.strip() for s in raw.split(',') if s.strip()}
            assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
            print(name, 'AXIOMS_PASS')
          print('G2_ACTUAL_BOUNDARY_ANCHORS := LEAN_VERIFIED')
          PY
