name: CompleteDoublePillow edge-valence exact-source build
on:
  push:
    branches: [research/face-pairing-pillow-20261030]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f1d485c181437f3b4265dac40712015ff9bb1544
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          axiom-audit: "false"
          use-github-cache: "false"
      - name: Build exact pinned edge-key theorem
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f1d485c181437f3b4265dac40712015ff9bb1544"
          lake build Poincare.FacePairingCompletePillowValence
