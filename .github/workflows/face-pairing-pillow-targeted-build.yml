name: FacePairingPillow exact-commit targeted build
on:
  push:
    branches:
      - research/face-pairing-pillow-20261030
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  targeted-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audited source commit
        uses: actions/checkout@v5
        with:
          ref: 1a0db4f4be74fbc97dae3e6465815e0302619f1e
      - name: Install Lean without global build or global audit
        uses: leanprover/lean-action@v1
        with:
          build: "false"
          axiom-audit: "false"
          use-github-cache: "false"
      - name: Confirm exact source and build target
        run: |
          test "$(git rev-parse HEAD)" = "1a0db4f4be74fbc97dae3e6465815e0302619f1e"
          test -f lean/Poincare/FacePairingPillow.lean
          git rev-parse HEAD
      - name: Build Poincare.FacePairingPillow
        run: lake build Poincare.FacePairingPillow
