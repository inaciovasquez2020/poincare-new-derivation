name: Pachner Candidate Regression

on:
  push:
    paths:
      - 'scripts/pachner_search.py'
      - 'tests/test_pachner_target_guard_unittest.py'
      - '.github/workflows/pachner-candidate-regression.yml'
  pull_request:
    paths:
      - 'scripts/pachner_search.py'
      - 'tests/test_pachner_target_guard_unittest.py'
      - '.github/workflows/pachner-candidate-regression.yml'

jobs:
  candidate-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run standard-library candidate regression
        run: python3 -m unittest discover -s tests -p test_pachner_target_guard_unittest.py -v
      - name: Recheck existing Pachner search tests without external packages
        run: |
          python3 - <<'PY'
          import runpy
          checks = runpy.run_path("tests/test_pachner_search.py")
          for name in sorted(k for k in checks if k.startswith("test_") and callable(checks[k])):
              checks[name]()
              print(f"{name}: PASS")
          PY
