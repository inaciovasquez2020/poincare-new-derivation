name: Move32 blocker lemma focused Lean audit

on:
  push:
    branches: [proof/move32-link-blocker]
  pull_request:
    branches: [main]
    paths:
      - lean/Poincare/Move32LinkBlocker.lean
      - .github/workflows/move32-link-blocker-focused.yml

permissions:
  contents: read

jobs:
  blocker-lemma:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install exact repo Lean toolchain and build dependencies
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
      - name: Build the new module, not just existing main targets
        run: lake build Poincare.Move32LinkBlocker
      - name: Execute and parse exact theorem axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean lean/Poincare/Move32LinkBlocker.lean > "$RUNNER_TEMP/move32-blocker-axioms.txt"
          cat "$RUNNER_TEMP/move32-blocker-axioms.txt"
          python3 - "$RUNNER_TEMP/move32-blocker-axioms.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          name = "Poincare.Move32Site.excess_iff_of_outside"
          lines = Path(sys.argv[1]).read_text().splitlines()
          matches = [line for line in lines if line.startswith(f"'{name}' ")]
          assert len(matches) == 1, f"Missing/duplicate axiom receipt for {name}: {lines}"
          report = matches[0]
          if "does not depend on any axioms" in report:
              found = set()
          else:
              result = re.search(r"depends on axioms:\s*\[([^\]]*)\]", report)
              assert result is not None, f"Malformed axiom report: {report}"
              found = {part.strip() for part in result.group(1).split(",") if part.strip()}
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          assert found <= allowed, f"Unapproved theorem axioms: {sorted(found - allowed)}"
          source = Path("lean/Poincare/Move32LinkBlocker.lean").read_text()
          assert not re.search(r"\b(sorry|admit|opaque|native_decide)\b", source)
          assert not re.search(r"(?m)^\s*axiom\b", source)
          print(f"MOVE32_LINK_BLOCKER_AXIOM_AUDIT := PASS {sorted(found)}")
          PY
