name: G2 active boundary pairing Lean audit
on:
  pull_request:
    paths:
      - 'lean/Poincare/G2ActualCarrierPerimeter.lean'
      - 'lean/Poincare/G2PrimalEdgeCoordinateSupport.lean'
      - 'research/candidates/G2ActiveBoundaryZero.lean'
      - '.github/workflows/g2-active-boundary-pairing.yml'
  workflow_dispatch:
jobs:
  active-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile and audit active carrier perimeter
        shell: bash
        run: |
          set -euo pipefail
          lake build Poincare.G2ActualCarrierPerimeter Poincare.G2PrimalEdgeCoordinateSupport
          lake env lean research/candidates/G2ActiveBoundaryZero.lean > /tmp/g2-active-boundary.log 2>&1 || {
            cat /tmp/g2-active-boundary.log
            exit 1
          }
          cat /tmp/g2-active-boundary.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          report=Path('/tmp/g2-active-boundary.log').read_text()
          name='Poincare.carrier_grid_active_side_pairing_zero'
          pattern=re.escape(f"'{name}'")+r" (?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)"
          m=list(re.finditer(pattern,report))
          assert len(m)==1,(name,len(m))
          axioms=set() if m[0].group(1) is None else {x.strip() for x in m[0].group(1).split(',') if x.strip()}
          assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
          print('G2_ACTIVE_BOUNDARY := LEAN_VERIFIED')
          PY
