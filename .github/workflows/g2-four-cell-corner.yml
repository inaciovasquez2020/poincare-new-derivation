name: G2 actual four-cell grid corner Lean audit
on:
  pull_request:
    paths:
      - 'research/candidates/G2GridFourCellCorner.lean'
      - '.github/workflows/g2-four-cell-corner.yml'
  workflow_dispatch:

jobs:
  four-cell-corner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile literal four-cell corner and tetrahedron witnesses
        shell: bash
        run: |
          set -euo pipefail
          lake build Poincare.GlobalMove32ReentryDyadicGridVertices
          lake env lean research/candidates/G2GridFourCellCorner.lean > /tmp/g2-four-corner.log 2>&1 || {
            cat /tmp/g2-four-corner.log
            exit 1
          }
          cat /tmp/g2-four-corner.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          report=Path('/tmp/g2-four-corner.log').read_text()
          for name in (
            'Poincare.CarrierLoopNullHomotopyData.squareGridCell_four_at_node_probe',
            'Poincare.CarrierLoopNullHomotopyData.squareGrid_four_neighbor_labels_common_tet_probe',
          ):
            pattern=re.escape(f"'{name}'")+r" (?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)"
            matches=list(re.finditer(pattern,report))
            assert len(matches)==1,(name,len(matches))
            payload=matches[0].group(1)
            axioms=set() if payload is None else {x.strip() for x in payload.split(',') if x.strip()}
            assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
            print(name,'AXIOMS_PASS')
          print('FOUR_CELL_CORNER := LEAN_VERIFIED')
          PY
