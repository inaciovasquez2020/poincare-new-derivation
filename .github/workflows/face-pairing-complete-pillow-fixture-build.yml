name: CompleteDoublePillow exact-source build
on:
  push:
    branches: [research/face-pairing-pillow-20261030]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f1ee7a1c15d2d093c59d4842d593b2804cdcea95
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          axiom-audit: "false"
          use-github-cache: "false"
      - name: Compile fixture at exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f1ee7a1c15d2d093c59d4842d593b2804cdcea95"
          lake build Poincare.FacePairingCompletePillowFixture
