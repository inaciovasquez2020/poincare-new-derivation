name: Dual-cell parity relations isolated audit
on:
  push:
    branches:
      - audit/reentry-adversarial-h1-20261115
  pull_request:
  workflow_dispatch:
jobs:
  parity-relations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Check dual-cell parity relations and axioms
        shell: bash
        run: |
          set -euo pipefail
          p=research/candidates/DualCellParityRelationsIsolated.lean
          if ! lake env lean "$p" > /tmp/dual-cell-relations.log 2>&1; then
            cat /tmp/dual-cell-relations.log
            exit 1
          fi
          cat /tmp/dual-cell-relations.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('/tmp/dual-cell-relations.log').read_text()
          assert 'sorryAx' not in log, 'sorryAx in audit log'
          for name in [
            'Poincare.DualCellParity.parity_invariant_edit',
            'Poincare.DualCellParity.parity_invariant_edits',
            'Poincare.DualCellParity.generated_dual_cycle_pairing_zero',
            'Poincare.DualCellParity.dual_cycle_pairing_zero_of_edge_fan_span',
            'Poincare.DualCellParity.range_eq_ker_of_equal_finrank',
            'Poincare.DualCellParity.exists_edge_fan_coeff_of_equal_finrank',
          ]:
            label=re.escape(f"'{name}'")
            pattern=label+r" (?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)"
            reports=list(re.finditer(pattern,log))
            assert len(reports)==1,(name,len(reports))
            payload=reports[0].group(1)
            axioms=set() if payload is None else {x.strip() for x in payload.split(',') if x.strip()}
            assert axioms <= {'propext','Classical.choice','Quot.sound'}, (name,axioms)
            print(name,'AXIOMS_PASS')
          PY
