name: Geometric carrier permutation Lean audit

on:
  push:
    paths:
      - 'lean/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/geometric-carrier-permutation.yml'
  pull_request:
    paths:
      - 'lean/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/geometric-carrier-permutation.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
      - name: Compile geometric carrier permutation
        run: lake build Poincare.GeometricCarrierPermutation
      - name: Audit kernel axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          audit="$(mktemp --suffix=.lean)"
          report="$(mktemp)"
          trap 'rm -f "$audit" "$report"' EXIT
          printf '%s\n' \
            'import Poincare.GeometricCarrierPermutation' \
            '#print axioms Poincare.triangulationTopologicalGeometricComplex_space_eq_of_perm' \
            '#print axioms Poincare.triangulationTopologicalGeometricCarrier_homeomorph_of_perm' > "$audit"
          lake env lean "$audit" > "$report"
          python3 - "$report" <<'PY'
          import re
          import sys
          from pathlib import Path
          report = Path(sys.argv[1]).read_text(encoding="utf-8")
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = [
              "Poincare.triangulationTopologicalGeometricComplex_space_eq_of_perm",
              "Poincare.triangulationTopologicalGeometricCarrier_homeomorph_of_perm",
          ]
          for name in names:
              prefix = f"'{name}' "
              lines = [line for line in report.splitlines() if line.startswith(prefix)]
              assert len(lines) == 1, f"missing or ambiguous axiom output for {name}"
              line = lines[0][len(prefix):]
              if line == "does not depend on any axioms":
                  axioms = set()
              else:
                  match = re.fullmatch(r"depends on axioms:\s*\[([^\]]*)\]", line)
                  assert match is not None, f"unrecognized axiom output: {name}: {line}"
                  axioms = {x.strip() for x in match.group(1).split(",") if x.strip()}
              assert axioms <= allowed, f"unapproved axioms: {name}: {axioms - allowed}"
              print(f"{name}: AXIOM_AUDIT_PASS {sorted(axioms)}")
          PY
