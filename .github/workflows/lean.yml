name: Lean Action CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: acb7617114dc6fea4a30ff585a802a8e0cdcd50d
          fetch-depth: 1

      - name: Lean setup
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false

      - name: Build direct dependency
        run: lake build Poincare.VertexLinkMod2CycleSupportGraphCycleWitnessLength

      - name: Direct compile and capture diagnostic
        id: lean
        shell: bash
        run: |
          set +e
          lake env lean lean/Poincare/VertexLinkMod2CycleSupportGraphCycleEndpointChain.lean > lean-error.log 2>&1
          status=$?
          cat lean-error.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Lean diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: lean-cycle-endpoint-chain-diagnostic-lean-ci
          path: lean-error.log

      - name: Preserve compile failure
        if: steps.lean.outputs.status != '0'
        run: exit 1
