name: Lean Action CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: 38fe35e44fdb4fc10a8d7e4bbeedaeb073bbcb6e
          fetch-depth: 1

      - name: Locate JIID declaration
        shell: bash
        run: |
          set -o pipefail
          grep -R -n --include='*.lean' -E '(^|[^A-Za-z0-9_])JIID([^A-Za-z0-9_]|$)' .
