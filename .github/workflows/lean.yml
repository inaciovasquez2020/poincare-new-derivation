name: Lean Action CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Lean build
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false

      - name: Build finite witnessed-state module
        run: lake build Poincare.GlobalMove32FiniteWitnessState
      - name: Build witness-anchored continuation module
        run: lake build Poincare.GlobalFanChordWitnessAnchoredContinuation

      - name: Build principal theorem module
        run: lake build Poincare.GlobalMove32ReentryLeastBoundaryEscapeIncidenceThreeFork

      - name: Principal theorem axiom audit
        run: lake env lean lean/Poincare/DegreeFourAxiomAudit.lean

  pachner-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run Pachner search tests
        run: python -m pytest -q tests/test_pachner_search.py
