name: Lean Action CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Lean build
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: false

      - name: Verify corrected Perelman interface and its axiom dependencies
        shell: bash
        run: |
          lake build Poincare.PerelmanPL
          lake env lean lean/Poincare/PerelmanPLAudit.lean > /tmp/perelman-pl-axioms.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          report = Path("/tmp/perelman-pl-axioms.txt").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          theorems = [
              "Poincare.universal_S3_false",
              "Poincare.conditional_PL_poincare_recognition",
              "Poincare.globalPhiSupportDescent_implies_Perelman_PL",
          ]
          for name in theorems:
              pattern = rf"(?m)^{re.escape(name)}\s*:\s*\[([^\]]*)\]"
              match = re.search(pattern, report)
              assert match is not None, f"missing #print axioms result for {name}: {report}"
              found = {s.strip() for s in match.group(1).split(",") if s.strip()}
              assert found <= allowed, f"unapproved axioms in {name}: {found - allowed}"
              print(f"{name}: allowed axioms only: {sorted(found)}")
          PY
          python3 tools/verify_perelman_pl_conditional_closure.py

      - name: Build finite witnessed-state module
        run: lake build Poincare.GlobalMove32FiniteWitnessState
      - name: Build witness-anchored continuation module
        run: lake build Poincare.GlobalFanChordWitnessAnchoredContinuation

      - name: Build principal theorem module
        run: lake build Poincare.GlobalMove32ReentryLeastBoundaryEscapeIncidenceThreeFork

      - name: Principal theorem axiom audit
        run: lake env lean lean/Poincare/DegreeFourAxiomAudit.lean
