name: G2 ordered boundary word parity Lean audit
on:
  pull_request:
    paths:
      - 'research/candidates/G2OrderedBoundaryWordParity.lean'
      - 'lean/Poincare/G2PrimalEdgeCoordinateSupport.lean'
      - 'lean/Poincare/G2PrimalEdgeSubdivisionParity.lean'
      - '.github/workflows/g2-ordered-boundary-word-parity.yml'
  workflow_dispatch:
jobs:
  ordered-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Compile ordered breakpoint anchor lemmas
        shell: bash
        run: |
          set -euo pipefail
          lake build Poincare.G2PrimalEdgeCoordinateSupport Poincare.G2PrimalEdgeSubdivisionParity
          lake env lean research/candidates/G2OrderedBoundaryWordParity.lean > /tmp/g2-ordered-anchors.log 2>&1 || {
            cat /tmp/g2-ordered-anchors.log
            exit 1
          }
          cat /tmp/g2-ordered-anchors.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log=Path('/tmp/g2-ordered-anchors.log').read_text()
          for name in [
            'Poincare.G2Boundary.g2_prefix_block_sum',
            'Poincare.G2Boundary.g2_ordered_boundary_word_parity',
          ]:
            pattern=re.escape(f"'{name}'")+r" (?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)"
            m=list(re.finditer(pattern,log))
            assert len(m)==1,(name,len(m))
            raw=m[0].group(1)
            axioms=set() if raw is None else {x.strip() for x in raw.split(',') if x.strip()}
            assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
            print(name,'AXIOMS_PASS')
          print('G2_ORDERED_WORD_PARITY := LEAN_VERIFIED')
          PY
